<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello Page</title>
    <style>             
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .hello-container {
            background-color: #fff;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 300px;
            padding: 30px;
            text-align: center;
        }

        h1 {
            color: #ff6f91;
            font-size: 36px;
            margin-bottom: 20px;
        }

        p {
            color: #333;
            font-size: 18px;
        }
    </style>
</head>
<body>
    <div class="hello-container">
        <h1>Hello, World!</h1>
        <p>Welcome to my first HTML page.</p>
    </div>
</body>
<p>
    <a href="https://www.google.com/?client=safari&zx=1771063885325&no_sw_cr=1">Go to google</a>
</p>
</html>
