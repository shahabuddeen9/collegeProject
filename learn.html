<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web Dev Bootcamp - Learn HTML, CSS & JavaScript</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --primary: #3498db;
      --dark: #2c3e50;
      --light: #ecf0f1;
      --success: #27ae60;
      --danger: #e74c3c;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      line-height: 1.6;
      color: var(--dark);
      background: #faf6f1;
    }
    .container {
      display: flex;
      min-height: 100vh;
    }
    .sidebar {
      width: 250px;
      background: var(--dark);
      color: white;
      padding: 20px;
      overflow-y: auto;
      position: fixed;
      height: 100vh;
    }
    .sidebar h1 {
      font-size: 20px;
      margin-bottom: 30px;
      border-bottom: 2px solid var(--primary);
      padding-bottom: 10px;
    }
    .nav-item {
      padding: 12px 15px;
      margin: 8px 0;
      cursor: pointer;
      border-radius: 6px;
      transition: all 0.3s;
    }
    .nav-item:hover {
      background: var(--primary);
      transform: translateX(5px);
    }
    .nav-item.active {
      background: var(--primary);
      font-weight: bold;
    }
    .main {
      margin-left: 250px;
      flex: 1;
      padding: 40px;
      overflow-y: auto;
    }
    .lesson {
      display: none;
      animation: fadeIn 0.3s;
    }
    .lesson.active {
      display: block;
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    .lesson h2 {
      color: var(--primary);
      margin-bottom: 20px;
      font-size: 28px;
    }
    .lesson h3 {
      margin-top: 30px;
      margin-bottom: 15px;
      color: var(--dark);
      font-size: 20px;
    }
    .content {
      background: white;
      padding: 25px;
      border-radius: 8px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .code-block {
      background: #282c34;
      color: #abb2bf;
      padding: 15px;
      border-radius: 6px;
      overflow-x: auto;
      margin: 15px 0;
      font-family: 'Courier New', monospace;
      font-size: 13px;
    }
    .code-block code {
      line-height: 1.5;
    }
    .keyword { color: #c678dd; }
    .string { color: #98c379; }
    .comment { color: #5c6370; font-style: italic; }
    .interactive {
      background: #f0f7ff;
      border-left: 4px solid var(--primary);
      padding: 20px;
      margin: 20px 0;
      border-radius: 6px;
    }
    .editor-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      margin: 20px 0;
    }
    .editor-pane, .preview-pane {
      border: 1px solid #ddd;
      border-radius: 6px;
      overflow: hidden;
    }
    textarea {
      width: 100%;
      height: 250px;
      padding: 15px;
      border: none;
      font-family: 'Courier New', monospace;
      font-size: 13px;
      resize: vertical;
      background: #f5f5f5;
    }
    .preview {
      padding: 20px;
      background: white;
      overflow: auto;
    }
    .btn {
      background: var(--primary);
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.3s;
      margin: 10px 0;
    }
    .btn:hover {
      background: #2980b9;
      transform: translateY(-2px);
    }
    .btn-secondary {
      background: var(--light);
      color: var(--dark);
    }
    .quiz-question {
      background: white;
      padding: 20px;
      border-radius: 6px;
      margin: 20px 0;
      border-left: 4px solid var(--primary);
    }
    .quiz-options {
      margin: 15px 0;
    }
    .quiz-option {
      padding: 12px;
      margin: 8px 0;
      border: 2px solid #ddd;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.3s;
    }
    .quiz-option:hover {
      border-color: var(--primary);
      background: #f0f7ff;
    }
    .quiz-option.selected {
      border-color: var(--primary);
      background: #e3f2fd;
    }
    .quiz-option.correct {
      border-color: var(--success);
      background: #d4edda;
    }
    .quiz-option.incorrect {
      border-color: var(--danger);
      background: #f8d7da;
    }
    .progress-bar {
      background: #ddd;
      height: 8px;
      border-radius: 4px;
      margin: 20px 0;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: var(--success);
      transition: width 0.3s;
    }
    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      margin: 20px 0;
    }
    .stat-card {
      background: white;
      padding: 20px;
      border-radius: 6px;
      text-align: center;
      border-top: 4px solid var(--primary);
    }
    .stat-number {
      font-size: 28px;
      font-weight: bold;
      color: var(--primary);
    }
    .stat-label {
      color: #7f8c8d;
      font-size: 13px;
    }
    .hint {
      background: #fff9e6;
      border-left: 4px solid #f39c12;
      padding: 15px;
      margin: 15px 0;
      border-radius: 6px;
    }
    .success-msg {
      background: #d4edda;
      color: #155724;
      padding: 15px;
      border-radius: 6px;
      margin: 15px 0;
    }
    @media (max-width: 768px) {
      .container { flex-direction: column; }
      .sidebar { width: 100%; height: auto; position: static; }
      .main { margin-left: 0; padding: 20px; }
      .editor-container { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Sidebar Navigation -->
    <div class="sidebar">
      <h1>🚀 Web Dev Course</h1>
      <div id="progressSidebar" class="progress-bar" style="margin: 20px 0;">
        <div class="progress-fill" style="width: 0%;"></div>
      </div>
      <div style="text-align: center; color: #aaa; font-size: 12px; margin-bottom: 20px;">
        <span id="progressPercent">0%</span> Complete
      </div>
      <nav id="navMenu"></nav>
    </div>

    <!-- Main Content -->
    <div class="main">
      <!-- Header Stats -->
      <div class="stats">
        <div class="stat-card">
          <div class="stat-number" id="lessonsCompleted">0</div>
          <div class="stat-label">Lessons Done</div>
        </div>
        <div class="stat-card">
          <div class="stat-number" id="quizScore">0%</div>
          <div class="stat-label">Quiz Average</div>
        </div>
        <div class="stat-card">
          <div class="stat-number" id="minutesLearned">0</div>
          <div class="stat-label">Minutes Spent</div>
        </div>
      </div>

      <!-- Lessons Container -->
      <div id="lessonsContainer"></div>
    </div>
  </div>

  <script src="learn.js"></script>
</body>
</html>
