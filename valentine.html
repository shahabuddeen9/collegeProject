<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Valentine Proposal</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Poppins', sans-serif;
      height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #ffd1dc, #ff7aa2);
      position: relative;
      color: white;
    }

    .container {
      text-align: center;
      z-index: 10;
      padding: 20px;
      max-width: 700px;
    }

    .bear {
      font-size: 5rem;
      animation: bounce 2s infinite;
      margin-bottom: 20px;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-20px); }
    }

    h1 {
      font-family: 'Dancing Script', cursive;
      font-size: clamp(2.5rem, 6vw, 5rem);
      margin-bottom: 15px;
      text-shadow: 0 0 15px rgba(255,255,255,0.4);
    }

    .subtitle {
      font-size: 1.2rem;
      font-style: italic;
      margin-bottom: 25px;
      opacity: 0.95;
    }

    .closing {
      margin-top: 30px;
      font-size: 1rem;
      opacity: 0.9;
    }

    .buttons {
      margin-top: 35px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 40px;
      flex-wrap: wrap;
      position: relative;
    }

    button {
      border: none;
      cursor: pointer;
      transition: all 0.3s ease;
      font-family: 'Poppins', sans-serif;
    }

    #yesBtn {
      background: linear-gradient(45deg, #ff1744, #ff4d6d);
      color: white;
      padding: 16px 42px;
      font-size: 1.3rem;
      border-radius: 999px;
      font-weight: 700;
      box-shadow: 0 10px 30px rgba(255, 0, 76, 0.35);
    }

    #yesBtn:hover {
      transform: scale(1.08);
      box-shadow: 0 0 25px rgba(255,255,255,0.7);
    }

    #noBtn {
      background: white;
      color: #ff1744;
      border: 2px solid #ff1744;
      padding: 12px 28px;
      font-size: 1rem;
      border-radius: 999px;
      font-weight: 600;
      position: relative;
    }

    .heart {
      position: fixed;
      bottom: -50px;
      pointer-events: none;
      animation: floatUp linear forwards;
      z-index: 1;
    }

    @keyframes floatUp {
      0% {
        transform: translateY(0) scale(0.7);
        opacity: 0;
      }
      10% {
        opacity: 1;
      }
      100% {
        transform: translateY(-120vh) scale(1.2);
        opacity: 0;
      }
    }

    .celebration {
      position: fixed;
      inset: 0;
      background: linear-gradient(135deg, #ff4d88, #ff1744);
      display: none;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      text-align: center;
      z-index: 999;
      overflow: hidden;
    }

    .celebration h2 {
      font-size: clamp(3rem, 10vw, 8rem);
      animation: pulse 1s infinite;
      margin-bottom: 20px;
    }

    .spin {
      font-size: 5rem;
      animation: spin 2s linear infinite;
      margin-bottom: 20px;
    }

    .celebration p {
      font-size: 1.5rem;
      max-width: 700px;
      padding: 0 20px;
    }

    @keyframes pulse {
      0%,100% { transform: scale(1); }
      50% { transform: scale(1.15); }
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .confetti {
      position: fixed;
      width: 10px;
      height: 18px;
      top: -20px;
      opacity: 0.9;
      animation: confettiFall linear forwards;
      z-index: 1000;
    }

    @keyframes confettiFall {
      0% {
        transform: translateY(0) rotate(0deg);
      }
      100% {
        transform: translateY(110vh) rotate(720deg);
      }
    }

    @media (max-width: 600px) {
      .buttons {
        flex-direction: column;
        gap: 20px;
      }

      #yesBtn {
        padding: 14px 34px;
      }
    }
  </style>
</head>
<body>

  <div class="container" id="mainContent">
    <div class="bear">🧸</div>

    <h1>Will You Be My Valentine❤️</h1>

    <div class="subtitle">
      I've been gathering courage to ask you this... 💌
    </div>

    <div class="buttons">
      <button id="yesBtn">Yes 💖</button>
      <button id="noBtn">No 🙈</button>
    </div>

    <div class="closing">
      Every love story is beautiful, but ours is my favourite ✨
    </div>
  </div>

  <div class="celebration" id="celebration">
    <h2>Yayyy!! 💕</h2>
    <div class="spin">💞</div>
    <p>I knew you'd say yes... You just made my world brighter ❤️</p>
  </div>

  <script>
    const noBtn = document.getElementById('noBtn');
    const yesBtn = document.getElementById('yesBtn');
    const celebration = document.getElementById('celebration');
    const mainContent = document.getElementById('mainContent');

    // Array of texts for the "No" button
    const noPhrases = [
      "No",
      "Are you sure?",
      "Are you positive? 🥺",
      "Pookie please...",
      "If you say no, I will be really sad...",
      "I will be very sad...",
      "Please?? 😭",
      "Don't do this to me...",
      "Last chance!"
    ];

    let msgIndex = 0;
    let heartsActive = true;

    function moveNoButton() {
      const yesRect = yesBtn.getBoundingClientRect();

      let x, y;
      let overlap = true;

      while (overlap) {
        x = Math.random() * (window.innerWidth - 120);
        y = Math.random() * (window.innerHeight - 70);

        overlap = !(
          x + 120 < yesRect.left ||
          x > yesRect.right ||
          y + 70 < yesRect.top ||
          y > yesRect.bottom
        );
      }

      noBtn.style.position = 'fixed';
      noBtn.style.left = `${x}px`;
      noBtn.style.top = `${y}px`;

      noBtn.textContent = messages[msgIndex];
      msgIndex = (msgIndex + 1) % messages.length;
    }

    noBtn.addEventListener('mouseover', moveNoButton);
    noBtn.addEventListener('touchstart', (e) => {
      e.preventDefault();
      moveNoButton();
    });
    noBtn.addEventListener('click', moveNoButton);

    yesBtn.addEventListener('click', () => {
      heartsActive = false;
      mainContent.style.display = 'none';
      celebration.style.display = 'flex';

      for (let i = 0; i < 120; i++) {
        createConfetti();
      }
    });

    function createHeart() {
      if (!heartsActive) return;

      const heart = document.createElement('div');
      heart.classList.add('heart');
      heart.innerHTML = '💖';

      heart.style.left = Math.random() * 100 + 'vw';
      heart.style.fontSize = (Math.random() * 25 + 15) + 'px';
      heart.style.animationDuration = (Math.random() * 5 + 5) + 's';

      document.body.appendChild(heart);

      setTimeout(() => {
        heart.remove();
      }, 10000);
    }

    function createConfetti() {
      const confetti = document.createElement('div');
      confetti.classList.add('confetti');

      const colors = [
        '#ff1744', '#ff9100', '#ffd600', '#00e676',
        '#00b0ff', '#d500f9', '#ffffff'
      ];

      confetti.style.background = colors[Math.floor(Math.random() * colors.length)];
      confetti.style.left = Math.random() * 100 + 'vw';
      confetti.style.animationDuration = (Math.random() * 3 + 2) + 's';
      confetti.style.transform = `rotate(${Math.random() * 360}deg)`;

      document.body.appendChild(confetti);

      setTimeout(() => {
        confetti.remove();
      }, 5000);
    }

    for (let i = 0; i < 15; i++) {
      setInterval(createHeart, 800);
    }
  </script>

</body>
</html>
